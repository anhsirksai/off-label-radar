<rect x="60" y="60" width="280" height="52" rx="9" fill="#22313f" stroke="#7aa7d6" stroke-width="1.6"/>
<text x="200.0" y="80" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Input: drug names</text>
<text x="200.0" y="97" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">comma-separated · e.g. colchicine, ketamine</text>
<rect x="60" y="146" width="280" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="200.0" y="166" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">RxNorm (rxnav.nlm.nih.gov)</text>
<text x="200.0" y="183" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">name → rxcui + synonyms (IN / BN / PIN)</text>
<rect x="60" y="238" width="280" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="200.0" y="258" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">DailyMed SPL</text>
<text x="200.0" y="275" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">Indications &amp; Usage section (LOINC 34067-9), verbatim · cached 30 d</text>
<rect x="60" y="330" width="280" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="200.0" y="350" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">ClinicalTrials.gov API v2 — by intervention</text>
<text x="200.0" y="367" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">active statuses · newest N per drug · cached 7 d</text>
<rect x="760" y="60" width="300" height="52" rx="9" fill="#22313f" stroke="#7aa7d6" stroke-width="1.6"/>
<text x="910.0" y="80" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Input: medical condition (plain text)</text>
<text x="910.0" y="97" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">e.g. alopecia areata, treatment-resistant depression</text>
<rect x="760" y="146" width="300" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="910.0" y="166" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">ClinicalTrials.gov API v2 — by condition</text>
<text x="910.0" y="183" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">DRUG / BIOLOGICAL trials · active · newest N</text>
<rect x="760" y="238" width="300" height="60" rx="9" fill="#3b2d13" stroke="#e6a83c" stroke-width="1.6"/>
<rect x="1022" y="244" width="32" height="16" rx="8" fill="#e6a83c"/>
<text x="1038" y="256" font-size="10" font-weight="600" text-anchor="middle" fill="#1a1204" fill-opacity="1.0">Jev</text>
<text x="910.0" y="258" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Jev · choice: condition_match</text>
<text x="910.0" y="275" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">which MeSH term did the user mean? → “you asked X, we searched Y”</text>
<rect x="760" y="330" width="300" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="910.0" y="350" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Interventions → RxNorm ingredient</text>
<text x="910.0" y="367" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">exact then approximate match · skip placebo / saline · skip fixed-dose combos</text>
<rect x="760" y="422" width="300" height="52" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="910.0" y="453.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">DailyMed SPL — one label per ingredient</text>
<rect x="400" y="520" width="380" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="590.0" y="540" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">(drug, trial) pairs</text>
<text x="590.0" y="557" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">+ heuristic hint: does a trial condition appear verbatim in the label text?</text>
<rect x="330" y="616" width="520" height="78" rx="9" fill="#3b2d13" stroke="#e6a83c" stroke-width="1.6"/>
<rect x="812" y="622" width="32" height="16" rx="8" fill="#e6a83c"/>
<text x="828" y="634" font-size="10" font-weight="600" text-anchor="middle" fill="#1a1204" fill-opacity="1.0">Jev</text>
<text x="590.0" y="636" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Jev · gate (2 × noul)</text>
<text x="590.0" y="653" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">off_label — is the trial outside the approved Indications &amp; Usage?  → P(off-label)</text>
<text x="590.0" y="668" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">is_active_arm — is the drug the studied intervention, not comparator?  → P(active) &lt; 0.5 ⇒ “comparator?” flag</text>
<polygon points="440,765.0 590.0,730 740,765.0 590.0,800" fill="#2a1f3a" stroke="#b489e6" stroke-width="1.6"/>
<text x="590.0" y="770.0" font-size="13" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">P(off-label) ≥ threshold (0.6)?</text>
<rect x="60" y="730" width="260" height="70" rx="9" fill="#153524" stroke="#4fc27a" stroke-width="1.6"/>
<text x="190.0" y="750" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">✅ Label already covers it</text>
<text x="190.0" y="767" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">approved use / standard of care</text>
<text x="190.0" y="782" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">no evidence pulled, no further Jev calls</text>
<rect x="860" y="730" width="260" height="60" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="990.0" y="750" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">PubMed E-utilities</text>
<text x="990.0" y="767" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">top-5 abstracts: drug AND condition</text>
<text x="990.0" y="782" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">phrase → word-AND → MeSH fallback</text>
<rect x="860" y="822" width="260" height="78" rx="9" fill="#3b2d13" stroke="#e6a83c" stroke-width="1.6"/>
<rect x="1082" y="828" width="32" height="16" rx="8" fill="#e6a83c"/>
<text x="1098" y="840" font-size="10" font-weight="600" text-anchor="middle" fill="#1a1204" fill-opacity="1.0">Jev</text>
<text x="990.0" y="842" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Jev · judge (score + choice)</text>
<text x="990.0" y="859" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">plausibility — 1–5 rubric: incidental → RCT evidence</text>
<text x="990.0" y="874" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">category — new_indication / label_extension /</text>
<text x="990.0" y="889" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">combination / unclear</text>
<rect x="860" y="932" width="260" height="56" rx="9" fill="#1d2732" stroke="#5b7fa6" stroke-width="1.6"/>
<text x="990.0" y="952" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">Rank</text>
<text x="990.0" y="969" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">P(off) × P(active) × plaus/5 × phase × recency</text>
<rect x="330" y="932" width="460" height="56" rx="9" fill="#3a2211" stroke="#f0a35a" stroke-width="1.6"/>
<text x="560.0" y="952" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">🧪 Ranked off-label candidates</text>
<text x="560.0" y="969" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">table · drawer (label vs trial, abstracts, Jev distributions) · CSV export · flags: comparator? · disagree</text>
<rect x="60" y="850" width="260" height="110" rx="9" fill="#1a1f26" stroke="#5a6472" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="190.0" y="870" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e8eef6" fill-opacity="1.0">SQLite cache (radar.db)</text>
<text x="190.0" y="887" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">labels 30 d · trials 7 d · PubMed 30 d</text>
<text x="190.0" y="902" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">Jev answers keyed by hash(state, questions, model)</text>
<text x="190.0" y="917" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">☐ re-judge (ignore cache) forces fresh Jev calls</text>
<text x="190.0" y="932" font-size="11" font-weight="400" text-anchor="middle" fill="#c9d4e3" fill-opacity="1.0">per-host rate limiters at ~70% of API ceilings</text>
<rect x="60" y="974" width="14" height="14" rx="3" fill="#1d2732" stroke="#5b7fa6"/>
<text x="80" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">public API step</text>
<rect x="226" y="974" width="14" height="14" rx="3" fill="#3b2d13" stroke="#e6a83c"/>
<text x="246" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">Jev typed decision</text>
<rect x="416" y="974" width="14" height="14" rx="3" fill="#2a1f3a" stroke="#b489e6"/>
<text x="436" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">threshold</text>
<rect x="534" y="974" width="14" height="14" rx="3" fill="#153524" stroke="#4fc27a"/>
<text x="554" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">on-label bucket</text>
<rect x="700" y="974" width="14" height="14" rx="3" fill="#3a2211" stroke="#f0a35a"/>
<text x="720" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">deliverable</text>
<rect x="834" y="974" width="14" height="14" rx="3" fill="#1a1f26" stroke="#5a6472"/>
<text x="854" y="985" font-size="11" font-weight="400" text-anchor="start" fill="#c9d4e3" fill-opacity="1.0">cache / politeness</text>
